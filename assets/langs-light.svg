<svg xmlns="http://www.w3.org/2000/svg" width="485" height="196" viewBox="0 0 485 196" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans', Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .label { font-size: 13px; fill: #59636e; }
    .value { font-size: 13px; font-weight: 600; fill: #1f2328; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .hero { font-size: 56px; font-weight: 600; fill: #1f2328; letter-spacing: -.03em; }
    .unit { font-size: 17px; fill: #59636e; }
    .line { font-size: 13px; fill: #59636e; }
    .line tspan.v { fill: #1f2328; font-weight: 600; }
    .tiny { font-size: 11px; fill: #59636e; }
  </style>
  <rect x="0.5" y="0.5" width="484" height="195" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="25" y="36" class="title">Most used languages</text>
  <mask id="bar"><rect x="25" y="54" width="435" height="6" rx="3" fill="#fff"/></mask><g mask="url(#bar)">
<rect x="25.00" y="54" width="160.29" height="6" fill="#3572A5"/>
<rect x="187.29" y="54" width="139.63" height="6" fill="#3178c6"/>
<rect x="328.92" y="54" width="23.72" height="6" fill="#f1e05a"/>
<rect x="354.64" y="54" width="23.41" height="6" fill="#89e051"/>
<rect x="380.05" y="54" width="22.30" height="6" fill="#663399"/>
<rect x="404.35" y="54" width="20.01" height="6" fill="#e34c26"/>
<rect x="426.36" y="54" width="15.09" height="6" fill="#b07219"/>
<rect x="443.46" y="54" width="14.54" height="6" fill="#00B4AB"/>
</g>
  <g class="fade" style="animation-delay:0ms"><rect x="25" y="83" width="9" height="9" rx="2" fill="#3572A5"/><text x="41" y="92" class="label">Python</text><text x="230" y="92" class="value" text-anchor="end">37.3%</text></g>
  <g class="fade" style="animation-delay:60ms"><rect x="255" y="83" width="9" height="9" rx="2" fill="#3178c6"/><text x="271" y="92" class="label">TypeScript</text><text x="460" y="92" class="value" text-anchor="end">32.6%</text></g>
  <g class="fade" style="animation-delay:120ms"><rect x="25" y="109" width="9" height="9" rx="2" fill="#f1e05a"/><text x="41" y="118" class="label">JavaScript</text><text x="230" y="118" class="value" text-anchor="end">5.9%</text></g>
  <g class="fade" style="animation-delay:180ms"><rect x="255" y="109" width="9" height="9" rx="2" fill="#89e051"/><text x="271" y="118" class="label">Shell</text><text x="460" y="118" class="value" text-anchor="end">5.8%</text></g>
  <g class="fade" style="animation-delay:240ms"><rect x="25" y="135" width="9" height="9" rx="2" fill="#663399"/><text x="41" y="144" class="label">CSS</text><text x="230" y="144" class="value" text-anchor="end">5.6%</text></g>
  <g class="fade" style="animation-delay:300ms"><rect x="255" y="135" width="9" height="9" rx="2" fill="#e34c26"/><text x="271" y="144" class="label">HTML</text><text x="460" y="144" class="value" text-anchor="end">5.1%</text></g>
  <g class="fade" style="animation-delay:360ms"><rect x="25" y="161" width="9" height="9" rx="2" fill="#b07219"/><text x="41" y="170" class="label">Java</text><text x="230" y="170" class="value" text-anchor="end">3.9%</text></g>
  <g class="fade" style="animation-delay:420ms"><rect x="255" y="161" width="9" height="9" rx="2" fill="#00B4AB"/><text x="271" y="170" class="label">Dart</text><text x="460" y="170" class="value" text-anchor="end">3.8%</text></g>
</svg>
