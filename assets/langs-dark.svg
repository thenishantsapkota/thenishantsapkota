<svg xmlns="http://www.w3.org/2000/svg" width="485" height="196" viewBox="0 0 485 196" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #58a6ff; }
    .label { font-size: 14px; fill: #9198a1; }
    .value { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .big { font-size: 28px; font-weight: 700; fill: #e6edf3; }
    .hot { fill: #f0883e; }
    .small { font-size: 12px; fill: #9198a1; }
  </style>
  <rect x="0.5" y="0.5" width="484" height="195" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="25" y="38" class="title">Most used languages</text>
  <mask id="bar"><rect x="25" y="56" width="435" height="8" rx="4" fill="#fff"/></mask><g mask="url(#bar)">
<rect x="25.00" y="56" width="162.29" height="8" fill="#3572A5"/>
<rect x="187.29" y="56" width="141.63" height="8" fill="#3178c6"/>
<rect x="328.92" y="56" width="25.72" height="8" fill="#f1e05a"/>
<rect x="354.64" y="56" width="25.41" height="8" fill="#89e051"/>
<rect x="380.05" y="56" width="24.30" height="8" fill="#663399"/>
<rect x="404.35" y="56" width="22.01" height="8" fill="#e34c26"/>
<rect x="426.36" y="56" width="17.09" height="8" fill="#b07219"/>
<rect x="443.46" y="56" width="16.54" height="8" fill="#00B4AB"/>
</g>
  <g class="fade" style="animation-delay:0ms"><circle cx="30" cy="87" r="5" fill="#3572A5"/><text x="41" y="92" class="label">Python</text><text x="230" y="92" class="value" text-anchor="end">37.3%</text></g>
  <g class="fade" style="animation-delay:60ms"><circle cx="260" cy="87" r="5" fill="#3178c6"/><text x="271" y="92" class="label">TypeScript</text><text x="460" y="92" class="value" text-anchor="end">32.6%</text></g>
  <g class="fade" style="animation-delay:120ms"><circle cx="30" cy="113" r="5" fill="#f1e05a"/><text x="41" y="118" class="label">JavaScript</text><text x="230" y="118" class="value" text-anchor="end">5.9%</text></g>
  <g class="fade" style="animation-delay:180ms"><circle cx="260" cy="113" r="5" fill="#89e051"/><text x="271" y="118" class="label">Shell</text><text x="460" y="118" class="value" text-anchor="end">5.8%</text></g>
  <g class="fade" style="animation-delay:240ms"><circle cx="30" cy="139" r="5" fill="#663399"/><text x="41" y="144" class="label">CSS</text><text x="230" y="144" class="value" text-anchor="end">5.6%</text></g>
  <g class="fade" style="animation-delay:300ms"><circle cx="260" cy="139" r="5" fill="#e34c26"/><text x="271" y="144" class="label">HTML</text><text x="460" y="144" class="value" text-anchor="end">5.1%</text></g>
  <g class="fade" style="animation-delay:360ms"><circle cx="30" cy="165" r="5" fill="#b07219"/><text x="41" y="170" class="label">Java</text><text x="230" y="170" class="value" text-anchor="end">3.9%</text></g>
  <g class="fade" style="animation-delay:420ms"><circle cx="260" cy="165" r="5" fill="#00B4AB"/><text x="271" y="170" class="label">Dart</text><text x="460" y="170" class="value" text-anchor="end">3.8%</text></g>
