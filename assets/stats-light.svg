  <g class="fade" style="animation-delay:0ms"><text x="25" y="78" class="label">⭐ Total stars</text><text x="230" y="78" class="value" text-anchor="end">79</text></g>
  <g class="fade" style="animation-delay:80ms"><text x="255" y="78" class="label">📦 Commits (all time)</text><text x="460" y="78" class="value" text-anchor="end">12,654</text></g>
  <g class="fade" style="animation-delay:160ms"><text x="25" y="110" class="label">🔀 Pull requests</text><text x="230" y="110" class="value" text-anchor="end">220</text></g>
  <g class="fade" style="animation-delay:240ms"><text x="255" y="110" class="label">🐞 Issues</text><text x="460" y="110" class="value" text-anchor="end">47</text></g>
  <g class="fade" style="animation-delay:320ms"><text x="25" y="142" class="label">👀 Code reviews</text><text x="230" y="142" class="value" text-anchor="end">222</text></g>
  <g class="fade" style="animation-delay:400ms"><text x="255" y="142" class="label">🤝 Contributed to (last year)</text><text x="460" y="142" class="value" text-anchor="end">1</text></g>
  <g class="fade" style="animation-delay:480ms"><text x="25" y="174" class="label">📁 Public repos</text><text x="230" y="174" class="value" text-anchor="end">60</text></g>
  <g class="fade" style="animation-delay:560ms"><text x="255" y="174" class="label">👥 Followers</text><text x="460" y="174" class="value" text-anchor="end">132</text></g>
