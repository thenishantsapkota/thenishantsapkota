<svg xmlns="http://www.w3.org/2000/svg" width="485" height="215" viewBox="0 0 485 215" role="img" aria-label="Nishant Sapkota&#x27;s GitHub stats">
  <title>Nishant Sapkota&#x27;s GitHub stats</title>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
