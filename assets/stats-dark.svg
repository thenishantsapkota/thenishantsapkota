<svg xmlns="http://www.w3.org/2000/svg" width="485" height="196" viewBox="0 0 485 196" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans', Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #e6edf3; }
    .label { font-size: 13px; fill: #8b949e; }
    .value { font-size: 13px; font-weight: 600; fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .hero { font-size: 56px; font-weight: 600; fill: #e6edf3; letter-spacing: -.03em; }
    .unit { font-size: 17px; fill: #8b949e; }
    .line { font-size: 13px; fill: #8b949e; }
    .line tspan.v { fill: #e6edf3; font-weight: 600; }
    .tiny { font-size: 11px; fill: #8b949e; }
  </style>
  <rect x="0.5" y="0.5" width="484" height="195" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="36" class="title">GitHub stats</text>
  <text x="24" y="74" class="label">Stars</text><text x="230" y="74" class="value" text-anchor="end">79</text>
  <text x="256" y="74" class="label">Commits, all time</text><text x="462" y="74" class="value" text-anchor="end">12,750</text>
  <text x="24" y="104" class="label">Pull requests</text><text x="230" y="104" class="value" text-anchor="end">220</text>
  <text x="256" y="104" class="label">Issues</text><text x="462" y="104" class="value" text-anchor="end">47</text>
  <text x="24" y="134" class="label">Code reviews</text><text x="230" y="134" class="value" text-anchor="end">222</text>
  <text x="256" y="134" class="label">Recently contributed to</text><text x="462" y="134" class="value" text-anchor="end">1</text>
  <text x="24" y="164" class="label">Public repos</text><text x="230" y="164" class="value" text-anchor="end">60</text>
  <text x="256" y="164" class="label">Followers</text><text x="462" y="164" class="value" text-anchor="end">132</text>
</svg>
