name: Update Readme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One run at a time, so two runs never push over each other.
concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update_readme:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kathmandu
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update date
        run: bash readme.sh

      - name: Build stat, streak, language and snake cards
        run: python3 scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commits are authored as you so they count on your contribution graph,
      # the same as the old date-only workflow.
      - name: Commit and push
        run: |
          git config user.name "thenishantsapkota"
          git config user.email "snishant306@gmail.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update date and profile stats"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Spotify sign-ins last 180 days. The card renews itself when Spotify allows
      # it; if it can't, open one issue 14 days before the card would go blank.
      - name: Check Spotify sign-in
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_URL: https://nishant-now-playing.vercel.app/api/token-status
        run: |
          status=$(curl -fsS --max-time 20 "$STATUS_URL") || { echo "Status page unreachable, skipping."; exit 0; }
          echo "$status"
          days=$(echo "$status" | jq -r '.daysLeft // empty')
          failing=$(echo "$status" | jq -r '.failing')
          if [ "$failing" != "true" ] && { [ -z "$days" ] || [ "$days" -gt 14 ]; }; then
            echo "Spotify sign-in is fine."
            exit 0
          fi
          title="Spotify card: sign in again"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "Reminder issue already open."
            exit 0
          fi
          if [ "$failing" = "true" ]; then
            why="Spotify is refusing the saved sign-in, so the Now Playing card currently shows nothing."
          else
            why="The Spotify sign-in for the Now Playing card runs out in $days days and Spotify hasn't renewed it."
          fi
          gh issue create --title "$title" --body "$why

          **Fix (about 2 minutes):**
          1. Clone this repo and, from its folder, run:
             \`\`\`
             SPOTIFY_CLIENT_ID=your_client_id SPOTIFY_CLIENT_SECRET=your_client_secret node now-playing/scripts/get-refresh-token.mjs
             \`\`\`
             (Client ID and secret: https://developer.spotify.com/dashboard, your app, Settings.)
          2. Open the link it prints, click Agree, and copy the token after \`SPOTIFY_REFRESH_TOKEN=\`.
          3. Paste it as the new value of \`SPOTIFY_REFRESH_TOKEN\` at https://vercel.com/thenishantsapkotas-projects/nishant-now-playing/settings/environment-variables and redeploy the latest deployment.

          The card switches to the new sign-in by itself. Close this issue once the card shows your music again; it reopens only if the problem comes back."
